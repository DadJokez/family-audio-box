[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "family-audio-box"
version = "0.1.0"
description = "A local-first, NFC-controlled audio player for children"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [{ name = "FamilyBox contributors" }]
keywords = ["raspberry-pi", "nfc", "audiobook", "mpv", "fastapi"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Multimedia :: Sound/Audio :: Players",
]
dependencies = [
  "fastapi>=0.115,<1",
  "jinja2>=3.1,<4",
  "python-multipart>=0.0.20,<1",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
pi = [
  "adafruit-blinka>=8.50,<10",
  "adafruit-circuitpython-pn532>=2.3,<3",
  "gpiozero>=2.0,<3",
  "lgpio>=0.2.2.0,<1; python_version < '3.13'",
  "adafruit-lgpio>=0.2.2.0,<1; python_version >= '3.13'",
]
dev = [
  "build>=1.2,<2",
  "httpx>=0.28,<1",
  "mypy>=1.14,<2",
  "pytest>=8.3,<10",
  "pytest-asyncio>=0.25,<2",
  "reportlab>=4.2,<5",
  "ruff>=0.9,<1",
]

[project.scripts]
familybox = "familybox.main:run"
familybox-diagnostics = "familybox.diagnostics:main"

[tool.hatch.build.targets.wheel]
packages = ["src/familybox"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --strict-config"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["familybox"]
warn_unreachable = true
